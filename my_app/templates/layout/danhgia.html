{% extends 'layout/base.html' %}

{% block title %}Đánh giá chất lượng phòng - MESP Hotel{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm border-0 bg-white">
            <div class="text-center mb-4">
                <div class="p-3 bg-warning-subtle text-warning rounded-circle d-inline-block mb-2">
                    <i class="fa-solid fa-star fa-2x"></i>
                </div>
                <h3 class="fw-bold text-dark">Đánh giá trải nghiệm</h3>
                <p class="text-secondary small">Ý kiến của quý khách giúp chúng tôi nâng cao chất lượng dịch vụ</p>
            </div>

            <form action="/danhgia" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Chọn phòng đã ở:</label>
                    <select name="phong" class="form-select" required>
                        <option value="">-- Chọn phòng --</option>
                        {% for p in phong %}
                        <option value="{{ p.MaPhong }}">Phòng {{ p.MaPhong }} ({{ p.LoaiPhong.LoaiPhong }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Khách hàng đánh giá:</label>
                    <select name="khach" class="form-select" required>
                        <option value="">-- Chọn khách hàng --</option>
                        {% for k in khach %}
                        <option value="{{ k.MaKhach }}">{{ k.HoTen or k.CMND }} (CMND: {{ k.CMND }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Số sao đánh giá:</label>
                    <select name="SoSao" class="form-select text-warning fw-bold">
                        <option value="5">★★★★★ - Tuyệt vời (5 sao)</option>
                        <option value="4">★★★★☆ - Rất tốt (4 sao)</option>
                        <option value="3">★★★☆☆ - Bình thường (3 sao)</option>
                        <option value="2">★★☆☆☆ - Cần cải thiện (2 sao)</option>
                        <option value="1">★☆☆☆☆ - Không hài lòng (1 sao)</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Nội dung nhận xét:</label>
                    <textarea name="nhanxet" rows="4" class="form-control" placeholder="Chia sẻ cảm nhận của bạn về độ sạch sẽ, tiện nghi, thái độ phục vụ..." required></textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/" class="btn btn-outline-secondary">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary px-4 fw-semibold"><i class="fa-solid fa-paper-plane me-1"></i>Gửi đánh giá</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
